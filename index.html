        function App() {

          const [activeMode, setActiveMode] = useState('training');
          const [gameState, setGameState] = useState('menu');
          const [problems, setProblems] = useState([]);
          const [currentIndex, setCurrentIndex] = useState(0);
          const [userAnswer, setUserAnswer] = useState('');
          const [userAnswersHistory, setUserAnswersHistory] = useState([]);
          const [score, setScore] = useState(0);
          const [streak, setStreak] = useState(0);
          
          const [speechRate, setSpeechRate] = useState(0.85);
          const [hideTextActive, setHideTextActive] = useState(false);
          const [repeatCount, setRepeatCount] = useState(0);
          
          const [validationMessage, setValidationMessage] = useState(null);
          const [historyList, setHistoryList] = useState([]);

          useEffect(() => {
            const saved = JSON.parse(localStorage.getItem('quinzet_history') || '[]');
            setHistoryList(saved);
          }, [gameState]);

          const playSound = (type) => {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              
              osc.connect(gain);
              gain.connect(ctx.destination);
              
              if (type === 'success') {
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
              } else if (type === 'error') {
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.setValueAtTime(147, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
              } else if (type === 'warning') {
                osc.frequency.setValueAtTime(330, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
              } else if (type === 'fanfare') {
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                  const noteOsc = ctx.createOscillator();
                  const noteGain = ctx.createGain();
                  noteOsc.connect(noteGain);
                  noteGain.connect(ctx.destination);
                  noteOsc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                  noteGain.gain.setValueAtTime(0.08, ctx.currentTime + idx * 0.1);
                  noteGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.4);
                  noteOsc.start(ctx.currentTime + idx * 0.1);
                  noteOsc.stop(ctx.currentTime + idx * 0.1 + 0.45);
                });
              }
            } catch (e) {
              console.log("Audio API no suportada.");
            }
          };

          const speakQuestion = (text, forceSpeak = false) => {
            if (!forceSpeak && activeMode === 'training' && !hideTextActive) return;
            
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(text);
              utterance.lang = 'ca-ES';
              utterance.rate = speechRate;
              window.speechSynthesis.speak(utterance);
            }
          };

          const startSeries = (serieId) => {
            const selected = [...SERIES_DATA[serieId].problemes];
            setProblems(selected);
            setSelectedSerie(serieId);
            setGameState('playing');
            setCurrentIndex(0);
            setUserAnswer('');
            setUserAnswersHistory([]);
            setScore(0);
            setStreak(0);
            setRepeatCount(0);
            setValidationMessage(null);

            setTimeout(() => {
              speakQuestion(selected[0].text, true);
            }, 300);
          };

          const handleNextQuestion = () => {
            if (currentIndex + 1 < problems.length) {
              const nextIdx = currentIndex + 1;
              setCurrentIndex(nextIdx);
              setUserAnswer('');
              setValidationMessage(null);
              setRepeatCount(0);
              
              setTimeout(() => {
                speakQuestion(problems[nextIdx].text, true);
              }, 300);
            } else {
              setGameState('finished');
              playSound('fanfare');
              
              const savedHistory = JSON.parse(localStorage.getItem('quinzet_history') || '[]');
              const newHistoryItem = {
                data: new Date().toLocaleDateString('ca-ES'),
                serie: SERIES_DATA[selectedSerie].nom,
                nivell: SERIES_DATA[selectedSerie].curs,
                mode: activeMode === 'training' ? 'Entrenament' : 'Oficial',
                encerts: score,
                total: problems.length
              };
              localStorage.setItem('quinzet_history', JSON.stringify([newHistoryItem, ...savedHistory].slice(0, 10)));
            }
          };

          const checkAnswer = (e) => {
            e.preventDefault();
            if (!userAnswer.trim()) return;

            const currentProb = problems[currentIndex];
            const correctNum = String(currentProb.numCorrect).toLowerCase().trim();
            const correctUnit = String(currentProb.unitCorrect).toLowerCase().trim();
            const cleanUserAnswer = userAnswer.toLowerCase().trim();

            const numberRegex = /(\d+[\/\.,]\d+|\d+)/g;
            const userNumbers = cleanUserAnswer.match(numberRegex);
            const userWords = cleanUserAnswer.replace(numberRegex, '').replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();

            if (!userNumbers) {
              playSound('error');
              setValidationMessage({
                type: 'error',
                text: "Ui! Sembla que no has escrit cap nombre o fracció."
              });
              return;
            }

            const userNum = userNumbers[0].replace(',', '.');
            const standardCorrectNum = correctNum.replace(',', '.');

            if (userNum !== standardCorrectNum) {
              playSound('error');
              
              setUserAnswersHistory([...userAnswersHistory, {
                question: currentProb.text,
                user: userAnswer,
                correct: `${currentProb.numCorrect} ${currentProb.unitCorrect}`,
                isCorrect: false
              }]);

              setValidationMessage({
                type: 'error',
                text: `Incorrecte. La resposta correcta era: ${currentProb.numCorrect} ${currentProb.unitCorrect}.`
              });
              
              setStreak(0);
              
              if (activeMode === 'official') {
                setTimeout(() => handleNextQuestion(), 3000);
              }
              return;
            }

            const correctUnitKeywords = correctUnit.split(' ').filter(w => w.length > 2);
            const userWordsClean = userWords.split(' ');

            let unitMatches = false;
            if (correctUnitKeywords.length === 0) {
              unitMatches = cleanUserAnswer.includes(correctUnit);
            } else {
              unitMatches = correctUnitKeywords.some(keyword => {
                const singularKey = keyword.slice(0, -1);
                return userWordsClean.some(userWord => 
                  userWord.includes(singularKey) || userWord.includes(keyword)
                );
              });
            }

            if (userWords.trim() === '') {
              playSound('warning');
              setValidationMessage({
                type: 'warning',
                text: "Alerta! Has encertat el nombre, però has oblidat la unitat! Recorda que a El Quinzet l'oblit de la unitat invalida l'exercici. Intenta-ho de nou afegint la unitat."
              });
              return;
            }

            if (!unitMatches) {
              playSound('warning');
              setValidationMessage({
                type: 'warning',
                text: `La unitat no sembla correcta. Estàs segur que són ${userWords}? Comprova bé de què parla el problema.`
              });
              return;
            }

            playSound('success');
            setScore(score + 1);
            setStreak(streak + 1);
            
            setUserAnswersHistory([...userAnswersHistory, {
              question: currentProb.text,
              user: userAnswer,
              correct: `${currentProb.numCorrect} ${currentProb.unitCorrect}`,
              isCorrect: true
            }]);

            setValidationMessage({
              type: 'success',
              text: "Excel·lent! Resposta correcta amb la seva unitat!"
            });

            if (activeMode === 'official') {
              setTimeout(() => handleNextQuestion(), 1500);
            }
          };

          const handleRepeatVoice = () => {
            if (repeatCount < 1 || activeMode === 'training') {
              speakQuestion(problems[currentIndex].text, true);
              if (activeMode === 'official') {
                setRepeatCount(repeatCount + 1);
              }
            }
          };

          return (
            <div className="pb-12">
              <header className="bg-white/90 backdrop-blur-md shadow-sm sticky top-0 z-50 transition-all border-b border-gray-100">
                <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="bg-gradient-to-tr from-indigo-600 to-sky-500 p-2.5 rounded-2xl text-white shadow-md shadow-indigo-100">
                      <IconBookOpen />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-700 to-sky-600 bg-clip-text text-transparent">
                        El Quinzet: Càlcul Mental
                      </h1>
                      <p className="text-xs text-gray-500 font-medium">
                        Sèries oficials de problemes de primària
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 bg-gray-100 p-1 rounded-xl border border-gray-200">
                    <button
                      onClick={() => {
                        setActiveMode('training');
                        setHideTextActive(false);
                      }}
                      className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        activeMode === 'training'
                          ? 'bg-white text-indigo-700 shadow-sm'
                          : 'text-gray-500 hover:text-gray-800'
                      }`}
                    >
                      Mode Entrenament
                    </button>
                    <button
                      onClick={() => {
                        setActiveMode('official');
                        setHideTextActive(true);
                      }}
                      className={`px-4 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                        activeMode === 'official'
                          ? 'bg-white text-indigo-700 shadow-sm'
                          : 'text-gray-500 hover:text-gray-800'
                      }`}
                    >
                      Mode Oficial El Quinzet
                    </button>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto px-4 mt-8">
                {gameState === 'menu' && (
                  <div className="space-y-8">
                    {/* Banner explicatiu d'El Quinzet */}
                    <div className="bg-indigo-900 text-white p-6 rounded-3xl shadow-xl relative overflow-hidden">
                      <div className="relative z-10 max-w-3xl">
                        <div className="inline-flex items-center gap-2 px-3 py-1 bg-indigo-800/80 rounded-full text-indigo-200 text-xs font-semibold mb-3 border border-indigo-700">
                          <IconSparkles /> Metodologia de Càlcul Mental
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-extrabold mb-2">
                          Instruccions Oficials d'El Quinzet
                        </h2>
                        <p className="text-indigo-200 text-sm leading-relaxed mb-4">
                          Cada exercici s'ha de respondre escrivint el <strong>nombre seguit de la unitat</strong> (per exemple, <i>"3 boles"</i>, <i>"12 euros"</i> o <i>"3/4 de taronja"</i>). La manca de la unitat invalida la resposta!
                        </p>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs bg-indigo-950/60 p-4 rounded-2xl border border-indigo-800/50">
                          <div>
                            <span className="font-bold text-sky-300">Mode Entrenament:</span> Es pot llegir el text del problema i escoltar l'àudio totes les vegades que calgui.
                          </div>
                          <div>
                            <span className="font-bold text-sky-300">Mode Oficial:</span> El text s'oculta. El mestre o l'àudio llegeix el problema una sola vegada (amb opció d'una única repetició).
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Selector de velocitat de veu */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-wrap items-center justify-between gap-4">
                      <div className="flex items-center gap-2">
                        <IconSettings />
                        <span className="text-xs font-bold text-gray-700">Velocitat del lector de veu:</span>
                      </div>
                      <div className="flex items-center gap-3">
                        {[0.7, 0.85, 1.0].map((rate) => (
                          <button
                            key={rate}
                            onClick={() => setSpeechRate(rate)}
                            className={`px-3 py-1 rounded-lg text-xs font-semibold border transition-all ${
                              speechRate === rate
                                ? 'bg-indigo-50 border-indigo-300 text-indigo-700'
                                : 'border-gray-200 text-gray-600 hover:bg-gray-50'
                            }`}
                          >
                            {rate === 0.7 ? 'Lenta (0.7x)' : rate === 0.85 ? 'Normal (0.85x)' : 'Ràpida (1.0x)'}
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Graella de Sèries */}
                    <div>
                      <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <IconBookOpen /> Selecciona una Sèrie de Problemes
                      </h3>
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {Object.entries(SERIES_DATA).map(([id, serie]) => (
                          <div
                            key={id}
                            className="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm hover:shadow-md transition-all hover:border-indigo-200 flex flex-col justify-between group"
                          >
                            <div>
                              <div className="flex items-center justify-between mb-2">
                                <span className="bg-indigo-50 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-lg">
                                  {serie.nom}
                                </span>
                                <span className="text-xs font-semibold text-gray-400">
                                  {serie.curs}
                                </span>
                              </div>
                              <p className="text-sm text-gray-600 mb-4">
                                {serie.descripció}
                              </p>
                            </div>
                            <button
                              onClick={() => startSeries(Number(id))}
                              className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 group-hover:scale-[1.01]"
                            >
                              Començar Sèrie <IconArrowRight />
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Historial de resultats */}
                    {historyList.length > 0 && (
                      <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h3 className="text-md font-bold text-gray-800 mb-4 flex items-center gap-2">
                          <IconHistory /> Darrers Resultats Guardats
                        </h3>
                        <div className="overflow-x-auto">
                          <table className="w-full text-left text-xs text-gray-600">
                            <thead className="bg-gray-50 text-gray-500 font-semibold border-b border-gray-100">
                              <tr>
                                <th className="p-3">Data</th>
                                <th className="p-3">Sèrie</th>
                                <th className="p-3">Nivell</th>
                                <th className="p-3">Mode</th>
                                <th className="p-3">Encerts</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                              {historyList.map((item, idx) => (
                                <tr key={idx} className="hover:bg-gray-50/50">
                                  <td className="p-3">{item.data}</td>
                                  <td className="p-3 font-semibold text-gray-800">{item.serie}</td>
                                  <td className="p-3">{item.nivell}</td>
                                  <td className="p-3">
                                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                      item.mode === 'Oficial' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
                                    }`}>
                                      {item.mode}
                                    </span>
                                  </td>
                                  <td className="p-3 font-bold text-indigo-600">{item.encerts} / {item.total}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {gameState === 'playing' && (
                  <div className="max-w-2xl mx-auto space-y-6">
                    {/* Barra de progrés */}
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                      <button
                        onClick={() => setGameState('menu')}
                        className="text-xs font-semibold text-gray-500 hover:text-gray-800"
                      >
                        ← Tornar al menú
                      </button>
                      <div className="flex items-center gap-3">
                        <span className="text-xs font-bold text-gray-400">
                          Pregunta {currentIndex + 1} de {problems.length}
                        </span>
                        <div className="w-24 bg-gray-100 h-2 rounded-full overflow-hidden">
                          <div
                            className="bg-indigo-600 h-full transition-all duration-300"
                            style={{ width: `${((currentIndex + 1) / problems.length) * 100}%` }}
                          ></div>
                        </div>
                      </div>
                    </div>

                    {/* Targeta del problema */}
                    <div className="bg-white p-8 rounded-3xl shadow-lg border border-gray-100 text-center space-y-6 relative overflow-hidden">
                      <div className="inline-block bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full">
                        {SERIES_DATA[selectedSerie].nom} · Problema {problems[currentIndex].id}
                      </div>

                      {/* Contingut del problema */}
                      {activeMode === 'official' && hideTextActive ? (
                        <div className="py-8 bg-indigo-50/50 rounded-2xl border border-dashed border-indigo-200">
                          <p className="text-indigo-900 font-bold text-lg mb-2">
                            🎧 Escolta el problema atentament
                          </p>
                          <p className="text-xs text-indigo-600 max-w-md mx-auto">
                            En el mode oficial d'El Quinzet, el text del problema s'oculta per treballar la memòria auditiva i la concentració.
                          </p>
                        </div>
                      ) : (
                        <h2 className="text-xl sm:text-2xl font-bold text-gray-800 leading-relaxed px-4">
                          "{problems[currentIndex].text}"
                        </h2>
                      )}

                      {/* Botons d'àudio */}
                      <div className="flex items-center justify-center gap-3">
                        <button
                          onClick={handleRepeatVoice}
                          disabled={activeMode === 'official' && repeatCount >= 1}
                          className={`px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 transition-all ${
                            activeMode === 'official' && repeatCount >= 1
                              ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                              : 'bg-sky-50 text-sky-700 hover:bg-sky-100'
                          }`}
                        >
                          <IconVolume2 />
                          {activeMode === 'official'
                            ? repeatCount >= 1 ? 'Sense relectures restants' : 'Repetir àudio (1 restant)'
                            : 'Escoltar problema de nou'}
                        </button>

                        {activeMode === 'official' && (
                          <button
                            onClick={() => setHideTextActive(!hideTextActive)}
                            className="px-3 py-2 bg-gray-50 hover:bg-gray-100 text-gray-600 rounded-xl text-xs font-semibold"
                          >
                            {hideTextActive ? 'Mostrar text' : 'Ocultar text'}
                          </button>
                        )}
                      </div>

                      {/* Formulari de resposta */}
                      <form onSubmit={checkAnswer} className="pt-4 space-y-4">
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                            Escriu la teva resposta (Nombre + Unitat):
                          </label>
                          <input
                            type="text"
                            value={userAnswer}
                            onChange={(e) => setUserAnswer(e.target.value)}
                            placeholder="Exemple: 5 boles"
                            className="w-full max-w-md px-5 py-3.5 text-center text-lg font-bold bg-gray-50 border-2 border-gray-200 rounded-2xl focus:border-indigo-600 focus:bg-white focus:outline-none transition-all shadow-inner"
                            autoFocus
                          />
                        </div>

                        <div className="flex justify-center gap-3">
                          <button
                            type="submit"
                            className="px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-sm shadow-md shadow-indigo-100 transition-all hover:scale-[1.02]"
                          >
                            Validar Resposta
                          </button>
                          
                          {activeMode === 'training' && validationMessage?.type === 'success' && (
                            <button
                              type="button"
                              onClick={handleNextQuestion}
                              className="px-6 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-sm shadow-md transition-all flex items-center gap-2"
                            >
                              Següent <IconArrowRight />
                            </button>
                          )}
                        </div>
                      </form>

                      {/* Missatge de validació */}
                      {validationMessage && (
                        <div
                          className={`p-4 rounded-2xl text-xs font-medium text-left flex items-start gap-3 transition-all ${
                            validationMessage.type === 'success'
                              ? 'bg-emerald-50 text-emerald-800 border border-emerald-200'
                              : validationMessage.type === 'warning'
                              ? 'bg-amber-50 text-amber-800 border border-amber-200'
                              : 'bg-rose-50 text-rose-800 border border-rose-200'
                          }`}
                        >
                          {validationMessage.type === 'success' && <IconCheckCircle />}
                          {validationMessage.type === 'warning' && <IconAlertTriangle className="text-amber-600 shrink-0" />}
                          {validationMessage.type === 'error' && <IconXCircle />}
                          <div>
                            <p className="font-bold mb-0.5">
                              {validationMessage.type === 'success' ? 'Molt bé!' : validationMessage.type === 'warning' ? 'Atenció!' : 'Incorrecte'}
                            </p>
                            <p>{validationMessage.text}</p>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                )}

                {gameState === 'finished' && (
                  <div className="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-xl border border-gray-100 text-center space-y-6">
                    <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                      <IconAward className="w-8 h-8" />
                    </div>

                    <div>
                      <h2 className="text-2xl font-extrabold text-gray-800">
                        Sèrie Completada!
                      </h2>
                      <p className="text-xs text-gray-500 mt-1">
                        {SERIES_DATA[selectedSerie].nom} · {SERIES_DATA[selectedSerie].curs}
                      </p>
                    </div>

                    <div className="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                      <p className="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-1">
                        Puntuació Final
                      </p>
                      <p className="text-4xl font-extrabold text-indigo-700">
                        {score} / {problems.length}
                      </p>
                      <p className="text-xs text-indigo-600 font-medium mt-2">
                        {score === problems.length
                          ? "🎉 Felicitats! Has aconseguit un ple absolut!"
                          : score >= problems.length / 2
                          ? "👍 Molt bona feina! Segueix practicant per millorar."
                          : "💪 Bon intent! Torna-ho a provar per millorar la nota."}
                      </p>
                    </div>

                    {/* Resum de respostes */}
                    <div className="text-left space-y-3">
                      <h3 className="text-xs font-bold text-gray-500 uppercase tracking-wider">
                        Resum de l'exercici:
                      </h3>
                      <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                        {userAnswersHistory.map((item, idx) => (
                          <div
                            key={idx}
                            className={`p-3 rounded-xl border text-xs flex items-start justify-between gap-3 ${
                              item.isCorrect
                                ? 'bg-emerald-50/50 border-emerald-100'
                                : 'bg-rose-50/50 border-rose-100'
                            }`}
                          >
                            <div>
                              <p className="font-semibold text-gray-800 mb-1">{item.question}</p>
                              <p className="text-gray-500">
                                La teva resposta: <span className="font-bold">{item.user}</span>
                              </p>
                              {!item.isCorrect && (
                                <p className="text-emerald-700 font-bold mt-0.5">
                                  Correcta: {item.correct}
                                </p>
                              )}
                            </div>
                            {item.isCorrect ? <IconCheckCircle /> : <IconXCircle />}
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="flex gap-3 pt-2">
                      <button
                        onClick={() => startSeries(selectedSerie)}
                        className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl font-bold text-xs transition-all"
                      >
                        Repetir Sèrie
                      </button>
                      <button
                        onClick={() => setGameState('menu')}
                        className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-xs shadow-md shadow-indigo-100 transition-all"
                      >
                        Tornar al Menú
                      </button>
                    </div>
                  </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
